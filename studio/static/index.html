<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="description" content="Local audio and video transcription." />
    <title>Whisper Studio</title>
    <link rel="icon" type="image/svg+xml" href="/static/mark.svg" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" type="module"></script>
  </head>
  <body>
    <a class="skip" href="#workspace">Skip to workspace</a>
    <aside class="rail">
      <a class="brand" href="#new" aria-label="Whisper Studio home"
        ><img src="/static/mark.svg" alt="" width="38" height="38" /><span
          >whisper</span
        ></a
      >
      <nav aria-label="Main navigation">
        <a href="#new" data-nav="new"
          ><span aria-hidden="true">＋</span> New transcription</a
        >
        <a href="#library" data-nav="library"
          ><span aria-hidden="true">▤</span> Library
          <span id="library-count" class="count"></span
        ></a>
        <a href="#settings" data-nav="settings"
          ><span aria-hidden="true">⚙</span> Settings</a
        >
      </nav>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <span class="local-badge"
          ><span class="dot"></span
          ><span id="connection">Local engine</span></span
        >
      </header>
      <div id="notice" class="notice" role="status" hidden></div>
      <main id="workspace" tabindex="-1">
        <p class="loading">Loading…</p>
      </main>
    </div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2 id="dialog-title"></h2>
        <p id="dialog-description"></p>
        <div id="dialog-options"></div>
        <div class="dialog-actions">
          <button value="cancel" class="button secondary">Cancel</button
          ><button value="confirm" class="button" id="dialog-confirm">
            Confirm
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
